plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blogspot.xeeshan.test01'
    compileSdk 34

    defaultConfig {
        applicationId "com.blogspot.xeeshan.test01"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // OpenWeatherMap API key: set OWM_API_KEY in ~/.gradle/gradle.properties
        // or as an environment variable. Never commit the key itself.
        def owmApiKey = project.hasProperty('OWM_API_KEY') ? project.property('OWM_API_KEY') : (System.getenv('OWM_API_KEY') ?: '')
        buildConfigField "String", "OWM_API_KEY", "\"${owmApiKey}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Align kotlin-stdlib-jdk7/jdk8 (pulled in transitively at 1.6.x) with kotlin-stdlib 1.8,
    // otherwise checkDebugDuplicateClasses fails.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
