apply plugin: 'com.android.application'

android {
    compileSdkVersion 21
    buildToolsVersion "21.1.2"

    defaultConfig {
        applicationId "com.blogspot.xeeshan.test01"
        minSdkVersion 15
        targetSdkVersion 21
        versionCode 1
        versionName "1.0"
        // OpenWeatherMap API key: set OWM_API_KEY in ~/.gradle/gradle.properties
        // or as an environment variable. Never commit the key itself.
        def owmApiKey = project.hasProperty('OWM_API_KEY') ? project.property('OWM_API_KEY') : (System.getenv('OWM_API_KEY') ?: '')
        buildConfigField "String", "OWM_API_KEY", "\"${owmApiKey}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile 'com.android.support:appcompat-v7:21.0.3'
}
